[package]
name = "diskloom-launcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
default-run = "diskloom"

[[bin]]
name = "diskloom"
path = "src/main.rs"

[workspace]
members = [
    "crates/bench",
    "crates/cli",
    "crates/core",
    "crates/dupes",
    "crates/export",
    "crates/ntfs",
    "crates/query",
    "crates/scan",
    "crates/ui",
    "crates/windows",
]
resolver = "2"
default-members = ["."]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Blu3Ph4ntom/diskloom"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.98"
bitflags = "2.9.1"
clap = { version = "4.5.38", features = ["derive"] }
csv = "1.3.1"
itoa = "1.0.15"
memchr = "2.7.4"
regex = "1.11.1"
tempfile = "3.20.0"
thiserror = "2.0.12"
windows = "0.61.1"
windows-sys = "0.61.2"

diskloom-bench = { path = "crates/bench" }
diskloom-cli = { path = "crates/cli" }
diskloom-core = { path = "crates/core" }
diskloom-dupes = { path = "crates/dupes" }
diskloom-export = { path = "crates/export" }
diskloom-ntfs = { path = "crates/ntfs" }
diskloom-query = { path = "crates/query" }
diskloom-scan = { path = "crates/scan" }
diskloom-ui = { path = "crates/ui" }
diskloom-windows = { path = "crates/windows" }

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
perf = { level = "deny", priority = 9 }
redundant_clone = { level = "deny", priority = 8 }
