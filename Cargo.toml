[package]
name = "diskloom-app"
version = "0.1.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
default-run = "diskloom"
build = "build.rs"

[[bin]]
name = "diskloom"
path = "src/main.rs"

[workspace]
members = [
    "crates/bench",
    "crates/cli",
    "crates/core",
    "crates/dupes",
    "crates/export",
    "crates/installer",
    "crates/ntfs",
    "crates/query",
    "crates/scan",
    "crates/windows",
]
resolver = "2"
default-members = ["."]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Blu3Ph4ntom/diskloom"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.98"
bitflags = "2.9.1"
clap = { version = "4.5.38", features = ["derive"] }
csv = "1.3.1"
embed-resource = "3.0.9"
itoa = "1.0.15"
memchr = "2.7.4"
regex = "1.11.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = "2.11.2"
tauri-build = "2.6.2"
tempfile = "3.20.0"
thiserror = "2.0.12"
windows = "0.61.1"
windows-sys = "0.61.2"

diskloom-bench = { path = "crates/bench" }
diskloom-cli = { path = "crates/cli" }
diskloom-core = { path = "crates/core" }
diskloom-dupes = { path = "crates/dupes" }
diskloom-export = { path = "crates/export" }
diskloom-ntfs = { path = "crates/ntfs" }
diskloom-query = { path = "crates/query" }
diskloom-scan = { path = "crates/scan" }
diskloom-windows = { path = "crates/windows" }

[dependencies]
diskloom-core.workspace = true
diskloom-ntfs.workspace = true
diskloom-scan.workspace = true
diskloom-windows.workspace = true
serde.workspace = true
tauri.workspace = true

[build-dependencies]
tauri-build.workspace = true

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
perf = { level = "deny", priority = 9 }
redundant_clone = { level = "deny", priority = 8 }
