[package]
name = "diskloom-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "diskloom-ui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
diskloom-core.workspace = true
diskloom-ntfs.workspace = true
diskloom-query.workspace = true
diskloom-scan.workspace = true
diskloom-windows.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
